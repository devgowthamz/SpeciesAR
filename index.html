<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebAR Experience - SPS1</title>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
    </style>

    <!-- A-Frame and MindAR Scripts -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
</head>
<body>
    <!-- A-Frame Scene -->
    <a-scene 
        mindar-image="imageTargetSrc: ./sps1.mind; autoStart: true; filterMinCF: 0.0001; filterBeta: 0.001;" 
        color-space="sRGB" 
        renderer="colorManagement: true, physicallyCorrectLights" 
        vr-mode-ui="enabled: false" 
        device-orientation-permission-ui="enabled: false">
        
        <a-assets>
            <a-asset-item id="spsModel" src="./sps1.glb"></a-asset-item>
        </a-assets>

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <!-- Target Entity -->
        <a-entity id="ar-target" mindar-image-target="targetIndex: 0">
            
            <!-- Lighting for the 3D Model -->
            <a-light type="ambient" color="#FFF" intensity="0.5"></a-light>
            <a-light type="directional" color="#FFF" intensity="1.5" position="-1 2 1"></a-light>
            
            <!-- 3D Model -->
            <!-- Scale and position can be adjusted based on the actual model dimensions -->
            <a-gltf-model 
                src="#spsModel" 
                rotation="0 0 0" 
                position="0 0 0" 
                scale="15 15 15"
                animation="property: rotation; to: 0 360 0; loop: true; dur: 10000; easing: linear;">
            </a-gltf-model>
            
        </a-entity>
    </a-scene>

    <!-- App Logic -->
    <script src="app.js"></script>
</body>
</html>
